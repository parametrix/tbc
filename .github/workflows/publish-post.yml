name: Publish New Posts

on:
  push:
    paths:
      - 'a/drafts/*.md'
      - 'a/drafts/published/*.md'
  workflow_dispatch:
    inputs:
      draft_file:
        description: 'Draft file to publish (e.g., a/drafts/my-post.md)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install markdown python-frontmatter pyyaml beautifulsoup4
      
      - name: Find new draft files
        id: find_drafts
        run: |
          # If manual trigger with specific file
          if [ -n "${{ github.event.inputs.draft_file }}" ]; then
            echo "drafts=${{ github.event.inputs.draft_file }}" >> $GITHUB_OUTPUT
            echo "updates=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Find new/modified .md files in drafts folder (exclude README and templates)
          DRAFTS=$(git diff --name-only HEAD~1 HEAD -- 'a/drafts/*.md' 2>/dev/null | grep -v 'README.md' | grep -v '_TEMPLATE.md' || echo "")
          
          # Find updated .md files in published folder
          UPDATES=$(git diff --name-only HEAD~1 HEAD -- 'a/drafts/published/*.md' 2>/dev/null | grep -v '.gitkeep' || echo "")
          
          # If no diff (first push), check for any drafts (exclude README and templates)
          if [ -z "$DRAFTS" ]; then
            DRAFTS=$(ls a/drafts/*.md 2>/dev/null | grep -v 'README.md' | grep -v '_TEMPLATE.md' || echo "")
          fi
          
          # Log what we found
          if [ -z "$DRAFTS" ] && [ -z "$UPDATES" ]; then
            echo "No draft files found to publish and no updates to process"
            echo "drafts=" >> $GITHUB_OUTPUT
            echo "updates=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Found new drafts: $DRAFTS"
          echo "Found updates: $UPDATES"
          echo "drafts=$DRAFTS" >> $GITHUB_OUTPUT
          echo "updates=$UPDATES" >> $GITHUB_OUTPUT
      
      - name: Publish new drafts
        if: steps.find_drafts.outputs.drafts != ''
        run: |
          for draft in ${{ steps.find_drafts.outputs.drafts }}; do
            echo "Publishing: $draft"
            
            # Skip if file doesn't exist
            if [ ! -f "$draft" ]; then
              echo "Warning: File not found: $draft - skipping"
              continue
            fi
            
            # Skip README and template files (extra safety)
            if [[ "$draft" == *"README.md" ]] || [[ "$draft" == *"_TEMPLATE.md" ]]; then
              echo "Skipping: $draft (not a post file)"
              continue
            fi
            
            python scripts/publish_post.py "$draft"
            
            # Move processed draft to archive
            if [ -f "$draft" ]; then
              mkdir -p a/drafts/published
              mv "$draft" "a/drafts/published/$(basename $draft)"
            fi
          done
      
      - name: Update existing posts
        if: steps.find_drafts.outputs.updates != ''
        run: |
          for update in ${{ steps.find_drafts.outputs.updates }}; do
            echo "Updating from: $update"
            
            # Skip if file doesn't exist
            if [ ! -f "$update" ]; then
              echo "Warning: File not found: $update - skipping"
              continue
            fi
            
            # Skip gitkeep
            if [[ "$update" == *".gitkeep" ]]; then
              continue
            fi
            
            python scripts/update_from_markdown.py "$update"
          done
      
      - name: Commit and push changes
        if: steps.find_drafts.outputs.drafts != '' || steps.find_drafts.outputs.updates != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Determine commit message based on what was processed
          if [ -n "${{ steps.find_drafts.outputs.drafts }}" ] && [ -n "${{ steps.find_drafts.outputs.updates }}" ]; then
            COMMIT_MSG="Publish new posts and update existing posts"
          elif [ -n "${{ steps.find_drafts.outputs.drafts }}" ]; then
            COMMIT_MSG="Publish new blog post(s)"
          else
            COMMIT_MSG="Update existing blog post(s)"
          fi
          
          git commit -m "$COMMIT_MSG"
          git push
      
      - name: Trigger Pages deployment
        if: steps.find_drafts.outputs.drafts != '' || steps.find_drafts.outputs.updates != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'static.yml',
              ref: 'main'
            });
            console.log('Triggered static.yml deployment workflow');
