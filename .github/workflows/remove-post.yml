name: Remove Post

on:
  workflow_dispatch:
    inputs:
      post_file:
        description: 'Post filename to remove (e.g., 2079_my_post.html)'
        required: true
        type: string
      confirm:
        description: 'Type "DELETE" to confirm removal'
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate input
        id: validate
        run: |
          POST_FILE="${{ github.event.inputs.post_file }}"
          
          # Strip 'a/' prefix if user included it
          POST_FILE="${POST_FILE#a/}"
          
          # Strip any leading/trailing whitespace
          POST_FILE=$(echo "$POST_FILE" | xargs)
          
          echo "Looking for: a/$POST_FILE"
          
          # List similar files for debugging
          echo "Files in a/ matching pattern:"
          ls -la a/*.html 2>/dev/null | grep -i "$(echo $POST_FILE | cut -c1-4)" | head -5 || echo "No similar files found"
          
          # Check if file exists
          if [ ! -f "a/$POST_FILE" ]; then
            echo "❌ Error: Post file 'a/$POST_FILE' not found"
            echo "Available test posts (with 'sample' or 'delete'):"
            ls a/*.html 2>/dev/null | grep -iE "sample|delete" | head -10 || echo "None found"
            exit 1
          fi
          
          # Extract post number from filename
          POST_NUM=$(echo "$POST_FILE" | grep -oE '^[0-9]+' || echo "")
          if [ -z "$POST_NUM" ]; then
            echo "❌ Error: Could not extract post number from filename"
            exit 1
          fi
          
          echo "post_file=$POST_FILE" >> $GITHUB_OUTPUT
          echo "post_num=$POST_NUM" >> $GITHUB_OUTPUT
          echo "✅ Validated: $POST_FILE (post #$POST_NUM)"
      
      - name: Remove post file
        run: |
          POST_FILE="${{ steps.validate.outputs.post_file }}"
          echo "Removing: a/$POST_FILE"
          rm -f "a/$POST_FILE"
      
      # Note: The chronological table in a/index.html is dynamically generated
      # from chrono-data.json via JavaScript, so no static row removal is needed.
      
      - name: Remove from toc-data.json
        run: |
          POST_FILE="${{ steps.validate.outputs.post_file }}"
          echo "Removing '$POST_FILE' from a/toc/toc-data.json"
          
          python3 << 'EOF'
          import json
          from pathlib import Path
          
          toc_file = Path("a/toc/toc-data.json")
          post_file = "${{ steps.validate.outputs.post_file }}"
          
          toc_data = json.loads(toc_file.read_text(encoding='utf-8'))
          removed_count = 0
          
          # Remove from topics
          for topic in toc_data.get('topics', []):
              original_len = len(topic.get('posts', []))
              topic['posts'] = [p for p in topic.get('posts', []) if p.get('file') != post_file]
              removed_count += original_len - len(topic['posts'])
              
              # Also check subtopics
              for subtopic in topic.get('subTopics', []):
                  original_len = len(subtopic.get('posts', []))
                  subtopic['posts'] = [p for p in subtopic.get('posts', []) if p.get('file') != post_file]
                  removed_count += original_len - len(subtopic['posts'])
          
          # Update metadata
          toc_data['totalPostLinks'] = sum(
              len(topic.get('posts', [])) +
              sum(len(subtopic.get('posts', [])) for subtopic in topic.get('subTopics', []))
              for topic in toc_data.get('topics', [])
          )
          
          from datetime import datetime
          toc_data['lastUpdated'] = datetime.now().strftime("%Y-%m-%d")
          
          toc_file.write_text(json.dumps(toc_data, indent=2, ensure_ascii=False), encoding='utf-8')
          
          print(f"Removed {removed_count} reference(s) to {post_file} from toc-data.json")
          EOF
      
      - name: Remove from chrono-data.json
        run: |
          POST_FILE="${{ steps.validate.outputs.post_file }}"
          POST_NUM="${{ steps.validate.outputs.post_num }}"
          echo "Removing '$POST_FILE' from a/toc/chrono-data.json"
          
          python3 << 'EOF'
          import json
          from pathlib import Path
          
          chrono_file = Path("a/toc/chrono-data.json")
          post_file = "${{ steps.validate.outputs.post_file }}"
          post_num = int("${{ steps.validate.outputs.post_num }}")
          
          chrono_data = json.loads(chrono_file.read_text(encoding='utf-8'))
          
          # Find the post to get its year before removing
          removed_post = None
          for post in chrono_data.get('posts', []):
              if post.get('file') == post_file or post.get('num') == post_num:
                  removed_post = post
                  break
          
          if removed_post:
              # Remove the post
              chrono_data['posts'] = [p for p in chrono_data['posts'] if p.get('file') != post_file and p.get('num') != post_num]
              chrono_data['totalPosts'] = len(chrono_data['posts'])
              
              # Update year statistics
              year = removed_post.get('year')
              if year:
                  for year_entry in chrono_data.get('years', []):
                      if year_entry.get('year') == year:
                          # Recalculate year statistics from remaining posts
                          posts_for_year = [p for p in chrono_data.get('posts', []) if p.get('year') == year]
                          year_entry['count'] = len(posts_for_year)
                          if year_entry['count'] > 0:
                              nums = [p.get('num') for p in posts_for_year if isinstance(p.get('num'), int)]
                              if nums:
                                  year_entry['firstPost'] = min(nums)
                                  year_entry['lastPost'] = max(nums)
                          else:
                              # Remove year entry if no posts remain for this year
                              chrono_data['years'] = [y for y in chrono_data['years'] if y.get('year') != year]
                          break
              
              from datetime import datetime
              chrono_data['lastUpdated'] = datetime.now().strftime("%Y-%m-%d")
              
              chrono_file.write_text(json.dumps(chrono_data, indent=2, ensure_ascii=False), encoding='utf-8')
              print(f"Removed post #{post_num} from chrono-data.json (total now: {chrono_data['totalPosts']})")
          else:
              print(f"Post {post_file} not found in chrono-data.json")
          EOF
      
      - name: Commit and push changes
        run: |
          POST_FILE="${{ steps.validate.outputs.post_file }}"
          POST_NUM="${{ steps.validate.outputs.post_num }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Remove post #$POST_NUM: $POST_FILE"
          git push
          
          echo "✅ Successfully removed post #$POST_NUM"
  
  confirm-required:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm != 'DELETE'
    steps:
      - name: Confirmation required
        run: |
          echo "❌ Removal cancelled: You must type 'DELETE' in the confirm field"
          exit 1
